# Some environments append a "Generated by Claude Code" footer to a PR body
# after the text leaves the author's hands, and re-append it when the author
# removes it from inside that environment. Squash merges copy the body toward
# main, so the footer is stripped here, where nothing can add it back. The
# edit re-fires this workflow once; the guard makes that run a no-op.
name: strip-footer
on:
  pull_request:
    types: [opened, edited, reopened]
permissions:
  pull-requests: write
jobs:
  strip:
    if: contains(github.event.pull_request.body, 'Generated by [Claude Code]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            const stripped = body.replace(/\s*---\s*_Generated by \[Claude Code\]\([^)]*\)_\s*$/, "").trimEnd() + "\n";
            if (stripped !== body)
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                body: stripped,
              });
