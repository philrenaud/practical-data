# Builds the site at practicaldata.dev for pull requests, and builds and
# deploys it on pushes to main. The API Worker (api/wrangler.jsonc) is deployed
# by hand, because a deploy there changes behavior and cost for every user.
name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy runs at a time. A newer push to main replaces a queued one.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # No step pushes, so the job keeps no Git credentials.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run web:check
      - run: npm test
      # The hand-labeled eval, replayed from recordings. It fails on any undocumented mismatch.
      - run: npm run eval -- --offline --strict
      # Builds the extension, then the SvelteKit site (web/) from recorded judgments. No model key is needed.
      - run: npm run demo
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler@4.147.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 487d9e8878e5651c3e6a8210c91b33f4
