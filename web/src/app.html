<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Keeps the extension from shading its own demo. -->
    <meta name="practical-data" content="off" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/icon128.png" />
    <!-- Site-wide social card; pages still set their own title and description. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Practical Data" />
    <meta property="og:title" content="Practical Data" />
    <meta
      property="og:description"
      content="A free, open-source Chrome extension that shades the comparable columns of any HTML table, using a decision model to judge which way is better."
    />
    <meta property="og:image" content="https://practicaldata.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://practicaldata.dev/og.png" />
    <!-- The above-the-fold faces, fetched in parallel with the stylesheet that declares them. -->
    <link rel="preload" href="/fonts/Cambridge-Light.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Prociono-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexMono-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
