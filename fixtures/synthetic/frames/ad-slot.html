<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ad</title>
<style>
  body { font: 12px/1.3 system-ui, sans-serif; margin: 8px; background: #fffbe8; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 2px 4px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<!-- A 300×250 ad slot with a small price table. The frame is too small to be page content, so the script must not judge it. -->
<strong>Weekend deals</strong>
<table id="deals" data-e2e-skip>
  <thead><tr><th>Item</th><th>Was</th><th>Now</th></tr></thead>
  <tbody>
    <tr><td>Desk lamp</td><td>$39</td><td>$24</td></tr>
    <tr><td>Kettle</td><td>$55</td><td>$31</td></tr>
    <tr><td>Backpack</td><td>$80</td><td>$49</td></tr>
    <tr><td>Headphones</td><td>$120</td><td>$72</td></tr>
  </tbody>
</table>
</body>
</html>
