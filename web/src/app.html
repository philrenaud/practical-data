<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Keeps the extension from shading its own demo. -->
    <meta name="practical-data" content="off" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/icon128.png" />
    <!-- The above-the-fold faces, fetched in parallel with the stylesheet that declares them. -->
    <link rel="preload" href="/fonts/Cambridge-Light.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Prociono-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexMono-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
