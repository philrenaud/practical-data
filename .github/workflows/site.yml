# Runs every offline check and builds the site at practicaldata.dev, for pull
# requests and pushes to main. A push to main then deploys the site, only if
# every earlier step passed. The API Worker (api/wrangler.jsonc) is deployed
# by hand, because a deploy there changes behavior and cost for every user.
name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy runs at a time. A newer push to main replaces a queued one.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so the job keeps no Git credentials.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The e2e loads the extension into Playwright's Chromium.
      - run: npx --no playwright install --with-deps chromium
      - run: npm run web:check
      # Every offline gate: format, types, unit tests, build, the hand-labeled eval replayed
      # from recordings, and the e2e. No model key is needed.
      - run: npm run check
      # Builds the extension, then the SvelteKit site (web/) from recorded judgments. No model key is needed.
      - run: npm run demo
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx --no wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 487d9e8878e5651c3e6a8210c91b33f4
